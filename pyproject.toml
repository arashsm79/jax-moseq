[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2", "versioneer[toml]==0.29"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-moseq"
dynamic = ["version"]
description = "JAX-based implementation of MoSeq (Motion Sequencing)"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.md"}
authors = [
    {name = "Caleb Weinreb", email = "calebsw@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numba>=0.56.4",
    "dynamax>=0.1.2",
    "tqdm",
    "optree",
    "jaxlib==0.6.2",
    "jax[cuda12]",
    "pytest>=9.0.2",
]

[project.urls]
Homepage = "https://github.com/dattalab/jax-moseq/"
Repository = "https://github.com/dattalab/jax-moseq/"

[project.optional-dependencies]
cuda = [
    "jax[cuda12]",
]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
]

[tool.setuptools]
packages = ["jax_moseq"]

[tool.setuptools.package-data]
"*" = ["*.md"]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "jax_moseq/_version.py"
versionfile_build = "jax_moseq/_version.py"
tag_prefix = ""
parentdir_prefix = ""

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
